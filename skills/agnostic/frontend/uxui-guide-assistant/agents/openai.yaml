interface:
  display_name: "UX/UI Guide Assistant"
  short_description: "Interactive UI proposals faithful to your app"
  default_prompt: "Use $uxui-guide-assistant to inspect the requested section and relevant approved proposals in readonly, iterate on an interactive preview using synthetic data, and save readable HTML with inline CSS/JavaScript and relative references to local fonts and assets only after I confirm its final version, destination, and any additional asset files. Embed binary resources only when I explicitly request a standalone single-file export."
policy:
  allow_implicit_invocation: false
