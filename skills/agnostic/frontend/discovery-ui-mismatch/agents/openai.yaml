interface:
  display_name: "Discovery UI Mismatch"
  short_description: "Find where a section departs from the rest of the app"
  default_prompt: "Use $discovery-ui-mismatch to compare the target section with the rest of the app in readonly, list verified UI, component and library mismatches, then discuss each one with show-me previews."
policy:
  allow_implicit_invocation: false
